<html><head><link rel='stylesheet' href='style.css'></head><body><header><img src='header-logo-20190319-ab7907fb.png'></header><div class='container'><h1>Information Security Briefing</h1><div class='card' id='content'><h3>Slide 1/4</h3><p>Protect company information and use approved systems only.</p><button onclick='next()'>Next</button></div></div><script>
let s=1;const slides=[['1/4','Protect company information and use approved systems only.'],['2/4','Threats: phishing, impersonation, credential theft.'],['3/4','Verify requests through secondary channels.'],['4/4','Knowledge Check: Verify supplier banking changes before action.']];
function next(){s++; if(s<=4){document.getElementById('content').innerHTML=`<h3>Slide ${slides[s-1][0]}</h3><p>${slides[s-1][1]}</p><button onclick='next()'>Next</button>`;} else {document.getElementById('content').innerHTML=`<h3>Acknowledgement</h3><p>I have reviewed this briefing.</p><button onclick='complete()'>Acknowledge</button>`;}}
function complete(){localStorage.setItem('briefingComplete','true');document.getElementById('content').innerHTML='<h2>✅ Briefing Completed</h2><p>Status recorded in demo tracker.</p><a href="management.html">View Dashboard</a>';}
</script></body></html>
